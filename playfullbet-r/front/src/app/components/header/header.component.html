<header class="vip-header">
  <div class="brand-area">
    <span class="brand">MOLLY'S <span class="gold">LEAGUE</span></span>
  </div>

  <div class="player-hud">
    
    <div class="balance-chip">
      <span class="label">FONDOS DISPONIBLES</span>
      <span class="value">{{ balance }} €</span>
    </div>

    <div class="divider"></div>

    <a routerLink="/profile" class="profile-pill">
      <div class="user-info">
        <span class="username">Alejandro</span>
        <span class="role">Miembro VIP</span>
      </div>
      <div class="avatar-container">
        <img src="assets/default-avatar.png" alt="Avatar" class="avatar">
      </div>
    </a>

  </div>
</header>
