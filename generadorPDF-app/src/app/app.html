<main class="h-screen bg-tinta/90 px-[15%] py-6 flex flex-col">
  <header class="text-center mb-6 shrink-0">
    <h1 class="font-gothic text-3xl uppercase tracking-widest text-pergamino">
      Cofradía · Generador de documentos de misiones
    </h1>
    <p class="mt-2 font-scroll text-pergamino/80">
      Prepara tu misión y previsualíza el documento en tiempo real
    </p>
  </header>

  <section class="flex-1 grid gap-6 md:grid-cols-2 min-h-0">
    <div class="rounded-xl bg-pergamino p-6 shadow-xl overflow-y-auto">
      <app-mision-form
        (valueChange)="onMissionChange($event)"
        (submitForm)="onMissionSubmit($event)">
      </app-mision-form>

      @if (generating) {
        <p class="mt-3 text-center text-sm italic text-tinta animate-pulse">
          Preparando el documento...
        </p>
      }
    </div>

    <div class="min-h-0 h-full">
      <app-pdf-preview [url]="previewUrl"></app-pdf-preview>
    </div>
  </section>
</main>
