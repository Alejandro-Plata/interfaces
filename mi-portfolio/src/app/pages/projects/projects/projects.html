<section id="projects" class="section-projects">
  <div class="container">
    
    <div class="projects-glass-panel">
      
      <div class="section-header">
        <h2 class="section-title">Proyectos <span class="dot">.</span></h2>
        <p class="section-desc">Esta es una muestra de algunos proyectos que he realizado a lo largo del último año.</p>
      </div>
  
      <div class="projects-grid">
        
        <section class="projects-container">

  @for (project of projects; track project.title) {
    <article class="project-card">

      <div class="card-header">
        <img 
          [src]="project.image" 
          [alt]="project.imageAlt"
        >
        
        <div class="links">
          <a 
            [href]="project.githubLink" 
            target="_blank" 
            class="github-link" 
            title="Ver Código"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" 
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61
                       c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 
                       A5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 
                       0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77
                       a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7
                       A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
        </div>
      </div>

      <h3 class="project-title">
        {{ project.title }}
      </h3>

      <p class="project-desc">
        {{ project.description }}
      </p>

      <ul class="tech-list">
        @for (tech of project.tech; track tech) {
          <li>{{ tech }}</li>
        }
      </ul>

    </article>
  }

</section>

  
      </div>

    </div>
  </div>
</section>
