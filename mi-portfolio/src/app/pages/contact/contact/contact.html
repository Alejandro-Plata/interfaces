<div class="contact-card">

  <h1 class="title">Contacto</h1>

  <form [formGroup]="contactForm" (ngSubmit)="sendMail()" class="form">
    <input 
      type="text" 
      placeholder="Nombre" 
      formControlName="name"
    />

    <input 
      type="text" 
      placeholder="Asunto" 
      formControlName="subject"
    />

    <textarea 
      rows="5" 
      placeholder="Mensaje" 
      formControlName="message">
    </textarea>

    <button type="submit" [disabled]="contactForm.invalid">
      ¡CONTÁCTAME!
    </button>
  </form>
</div>
