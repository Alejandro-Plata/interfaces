<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>
  <base href="/" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          "primary": "#11d452",
          "background-light": "#f6f8f6",
          "background-dark": "#0a110d",
          "rank-s": "#ff4d4d",
          "rank-a": "#b366ff",
          "rank-b": "#ff9933",
          "rank-c": "#3399ff",
          "rank-d": "#94a3b8",
        },
        fontFamily: {
          "display": ["Space Grotesk", "sans-serif"],
          "sans": ["Noto Sans", "sans-serif"]
        },
      },
    },
  }
</script>

<style type="text/tailwindcss">
  @layer base {
    body {
      @apply bg-background-dark text-white;
    }
  }
  .shuriken-pattern {
    background-image: radial-gradient(#11d452 0.5px, transparent 0.5px);
    background-size: 24px 24px;
    opacity: 0.1;
  }
</style>
</head>

<body class="bg-background-dark font-sans text-white">
  <app-root></app-root>
</body>
</html>
