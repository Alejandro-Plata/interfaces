<ion-header class="ion-no-border">
  <div class="sticky top-0 z-50 w-full border-b border-white/10 bg-background-dark/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-4">
        
        <div class="flex items-center gap-4">
          <button routerLink="/mission-list" class="group flex items-center justify-center size-10 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
          </button>

          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center size-10 bg-primary/20 rounded-lg text-primary">
              <span class="material-symbols-outlined">fingerprint</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Operative Profile</h1>
          </div>
        </div>

        <div class="flex items-center gap-4">
           </div>

      </div>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="fixed inset-0 pointer-events-none opacity-[0.03]" 
       style="background-image: radial-gradient(#11d452 1px, transparent 1px); background-size: 24px 24px;"></div>

  <main class="flex min-h-[90vh] items-center justify-center px-6 py-10">
    
    <div class="relative w-full max-w-md overflow-hidden rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl transition-all hover:border-primary/30 hover:shadow-[0_0_50px_-10px_rgba(17,212,82,0.15)] group">
      
      <div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-primary/10 to-transparent opacity-50"></div>
      
      <div class="relative flex flex-col items-center p-8 text-center">
        
        <div class="relative mb-6">
          <div class="absolute -inset-4 rounded-full border border-primary/20 opacity-0 transition-all duration-700 group-hover:scale-110 group-hover:opacity-100"></div>
          <div class="absolute -inset-4 rounded-full border border-dashed border-primary/20 opacity-0 transition-all duration-1000 group-hover:rotate-180 group-hover:opacity-100"></div>
          
          <div class="relative size-40 overflow-hidden rounded-full border-4 border-[#0a110d] bg-[#0a110d] shadow-2xl">
            <img src="https://i.pravatar.cc/300?u=uzumaki" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent opacity-50 mix-blend-overlay"></div>
          </div>
          
          <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 rounded-full border border-[#0a110d] bg-primary px-4 py-1 text-[10px] font-black uppercase tracking-widest text-[#0a110d] shadow-lg">
            {{ninja.rank}}
          </div>
        </div>

        <div class="mb-8 mt-2 space-y-1">
          <h2 class="font-display text-4xl font-black tracking-tighter text-white uppercase">{{ninja.name}}</h2>
          <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">{{ninja.village}}</p>
        </div>

        <div class="grid w-full grid-cols-1 gap-4">
          
          <div class="rounded-2xl border border-white/5 bg-black/20 p-5 transition-colors hover:bg-black/40">
            <div class="mb-3 flex items-end justify-between">
              <span class="flex items-center gap-2 text-xs font-bold uppercase text-slate-400">
                <span class="material-symbols-outlined text-sm text-primary">bolt</span>
                Nivel {{ninja.level}}
              </span>
              <span class="font-mono text-xs text-primary">{{ninja.xp}} / {{ninja.nextLevelXp}} XP</span>
            </div>
            
            <div class="relative h-3 w-full overflow-hidden rounded-full bg-black/50 ring-1 ring-white/10">
              <div class="h-full bg-primary shadow-[0_0_15px_rgba(17,212,82,0.6)] relative transition-all duration-1000 ease-out" 
                   [style.width.%]="getXpPercentage()">
                   <div class="absolute right-0 top-0 h-full w-[1px] bg-white"></div>
              </div>
            </div>
            <p class="mt-2 text-right text-[10px] text-slate-600">Faltan {{ninja.nextLevelXp - ninja.xp}} para subir</p>
          </div>

          <div class="rounded-2xl border border-white/5 bg-black/20 p-5 transition-colors hover:bg-black/40">
            <div class="flex items-center justify-between">
              <div class="flex flex-col items-start">
                <span class="mb-1 text-[10px] font-black uppercase tracking-widest text-slate-500">Fondos Disponibles</span>
                <div class="flex items-baseline gap-1">
                  <span class="font-display text-3xl font-black text-white tracking-tight">300</span>
                  <span class="text-sm font-bold text-primary">Ryō</span>
                </div>
              </div>
              <div class="flex size-12 items-center justify-center rounded-xl bg-primary/10 text-primary ring-1 ring-primary/20">
                <span class="material-symbols-outlined text-2xl">account_balance_wallet</span>
              </div>
            </div>
          </div>

        </div>

        <div class="mt-8 flex items-center gap-2 opacity-30">
          <div class="h-1 w-1 rounded-full bg-white"></div>
          <div class="h-px w-24 bg-gradient-to-r from-transparent via-white to-transparent"></div>
          <div class="h-1 w-1 rounded-full bg-white"></div>
        </div>

      </div>
    </div>
  </main>
</ion-content>
