<ion-content [fullscreen]="true">
  <div class="relative flex flex-col min-h-screen w-full items-center justify-center bg-background-dark font-display overflow-hidden p-4">
    
    <div class="absolute inset-0 shuriken-pattern pointer-events-none"></div>
    <div class="absolute top-10 right-10 opacity-10 pointer-events-none">
      <span class="material-symbols-outlined text-[200px] text-primary">navigation</span>
    </div>
    <div class="absolute bottom-10 left-10 opacity-10 pointer-events-none rotate-45">
      <span class="material-symbols-outlined text-[150px] text-primary">security</span>
    </div>

    <div class="w-full max-w-[520px] flex flex-col gap-8 z-10 my-auto">
      
      <header class="flex items-center justify-between border-b border-primary/20 px-6 py-4 backdrop-blur-sm bg-background-dark/30 rounded-t-xl">
        <div class="flex items-center gap-4 text-white">
          <div class="size-8 text-primary">
            <svg fill="none" viewBox="0 0 48 48">
              <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
            </svg>
          </div>
          <h2 class="text-white text-xl font-bold tracking-tight">SHINOBI ENROLLMENT</h2>
        </div>
        <div class="hidden md:flex items-center gap-3">
          <span class="text-primary/60 text-xs font-bold tracking-widest uppercase">Security Level: Jonin</span>
        </div>
      </header>

      <div class="parchment-bg border border-primary/20 shadow-2xl rounded-xl p-8 md:p-10 relative overflow-hidden">
        
        <div class="relative mb-8">
          <h1 class="text-white text-[32px] font-bold leading-tight text-center pb-2">Shinobi Enrollment</h1>
          <div class="h-1 w-16 bg-primary mx-auto rounded-full"></div>
          <p class="text-white/70 text-base mt-4 text-center">Register your lineage and skills to join the operative network.</p>
        </div>

        <form class="flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label class="text-white text-sm font-medium uppercase tracking-wider px-1">Ninja Identifier</label>
            <div class="relative group">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/50 group-focus-within:text-primary transition-colors">person</span>
              <input type="text" placeholder="Desired Shinobi ID" 
                class="w-full rounded-lg text-white border border-primary/30 bg-black/40 focus:ring-1 focus:ring-primary h-12 pl-12 pr-4 outline-none transition-all">
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-white text-sm font-medium uppercase tracking-wider px-1">Village Affiliation</label>
            <div class="relative group">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/50 group-focus-within:text-primary transition-colors">hub</span>
              <select class="w-full rounded-lg text-white border border-primary/30 bg-black/40 focus:ring-1 focus:ring-primary h-12 pl-12 pr-4 outline-none transition-all appearance-none">
                <option disabled selected value="">Select your village</option>
                <option value="leaf">Hidden Leaf (Konohagakure)</option>
                <option value="sand">Hidden Sand (Sunagakure)</option>
                <option value="mist">Hidden Mist (Kirigakure)</option>
              </select>
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-white text-sm font-medium uppercase tracking-wider px-1">Secret Scroll Password</label>
            <div class="relative group">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/50 group-focus-within:text-primary transition-colors">lock</span>
              <input type="password" placeholder="Enter secure passphrase" 
                class="w-full rounded-lg text-white border border-primary/30 bg-black/40 focus:ring-1 focus:ring-primary h-12 pl-12 pr-4 outline-none transition-all">
            </div>
          </div>

          <button type="submit" class="w-full h-14 bg-primary text-black flex items-center justify-center gap-3 rounded-lg text-lg font-bold mt-6 hover:bg-primary/90 active:scale-95 transition-all shadow-lg shadow-primary/20">
            <span class="material-symbols-outlined">colorize</span>
            <span>REQUEST ENROLLMENT</span>
          </button>
        </form>

        <div class="mt-8 flex items-center justify-center gap-4 opacity-40">
          <div class="h-[1px] flex-1 bg-white/20"></div>
          <span class="text-[10px] text-white uppercase tracking-widest whitespace-nowrap">United Shinobi Alliance</span>
          <div class="h-[1px] flex-1 bg-white/20"></div>
        </div>
      </div>

      <div class="text-center">
        <p class="text-white/40 text-sm">Existing operative? <a class="text-primary/60 hover:text-primary font-bold transition-colors cursor-pointer" routerLink="/login">Login here</a></p>
      </div>
    </div>

    <footer class="mt-auto py-8 text-center text-white/20 text-[10px] tracking-widest uppercase">
      © Hidden Leaf Management Systems • Level 4 Clearance Required
    </footer>
  </div>
</ion-content>
