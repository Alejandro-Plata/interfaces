<div class="app-container">
  <div class="main-content">

    <!-- El Padre escucha el evento "petRegistered" del Hermano A (PetFormComponent) -->
    <app-pet-form (petRegistered)="whenPetRegistered($event)" />

    <!-- El Padre pasa la lista actualizada por "pets" al Hermano B (PetListComponent) -->
    <app-pet-list [pets]="pets" />

  </div>
</div>
