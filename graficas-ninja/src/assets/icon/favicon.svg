<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo oscuro -->
  <rect width="64" height="64" rx="10" fill="#0d0d0d"/>

  <!-- Cuerpo ninja (silueta) -->
  <ellipse cx="32" cy="20" rx="10" ry="11" fill="#1a1a1a" stroke="#cc0000" stroke-width="1.2"/>
  <!-- Máscara ninja (franja roja) -->
  <rect x="22" y="17" width="20" height="5" rx="1" fill="#cc0000"/>
  <!-- Ojos -->
  <rect x="25" y="18" width="4" height="3" rx="1" fill="#0d0d0d"/>
  <rect x="35" y="18" width="4" height="3" rx="1" fill="#0d0d0d"/>
  <!-- Brillo en ojo -->
  <rect x="26" y="18.5" width="1.5" height="1.5" rx="0.3" fill="#ffffff" opacity="0.7"/>
  <rect x="36" y="18.5" width="1.5" height="1.5" rx="0.3" fill="#ffffff" opacity="0.7"/>

  <!-- Cuerpo -->
  <path d="M22 30 Q32 27 42 30 L41 42 Q32 45 23 42 Z" fill="#1a1a1a" stroke="#cc0000" stroke-width="0.8"/>

  <!-- Caja de inventario con símbolo + -->
  <rect x="10" y="44" width="44" height="14" rx="3" fill="#1a1a1a" stroke="#cc0000" stroke-width="1.2"/>
  <!-- línea vertical + -->
  <line x1="32" y1="47" x2="32" y2="55" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>
  <!-- línea horizontal + -->
  <line x1="28" y1="51" x2="36" y2="51" stroke="#cc0000" stroke-width="2" stroke-linecap="round"/>

  <!-- Kunais a los lados -->
  <line x1="8" y1="35" x2="16" y2="28" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="8,35 5,33 7,30" fill="#aaa"/>
  <line x1="56" y1="35" x2="48" y2="28" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="56,35 59,33 57,30" fill="#aaa"/>
</svg>
