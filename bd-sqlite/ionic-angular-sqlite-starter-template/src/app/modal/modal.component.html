<ion-header>
  <ion-toolbar>
    <ion-title>Nuevo Item</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item>
      <ion-input label="Nombre del objeto" labelPlacement="floating" placeholder="Ej. Filtro de agua"
        [(ngModel)]="itemName">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Cantidad" labelPlacement="floating" type="number" [(ngModel)]="itemStock">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Categoría" labelPlacement="floating" placeholder="Selecciona una categoria"
        [(ngModel)]="selectedCategory">
        <!-- Uso ngFor porque esta versión de Angular no soporta el for -->
        <ion-select-option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

  </ion-list>

  <div class="ion-padding-top">
    <ion-button expand="block" (click)="confirm()" [disabled]="!itemName || !selectedCategory">
      Guardar Cambios
    </ion-button>
  </div>

</ion-content>
