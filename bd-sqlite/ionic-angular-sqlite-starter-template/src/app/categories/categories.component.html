<ion-list>
  <ion-item-sliding *ngFor="let cat of categories">
    <ion-item>
      <ion-label>
        <h2>{{ cat.name }}</h2>
      </ion-label>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option color="danger" (click)="confirmDelete(cat)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>

<ion-item *ngIf="categories.length === 0" lines="none">
  <ion-label color="medium" class="ion-text-center">No hay categorías</ion-label>
</ion-item>
